<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VAULT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* DARK THEME — deep space, minimal, independent cards */
        body {
            background: #0a0c12;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            padding: 2rem 1.5rem;
        }

        /* subtle background glow */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 10% 20%, rgba(30, 40, 70, 0.4), #0a0c12 80%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* header minimal */
        .page-header {
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .page-header p {
            color: #6b7280;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        /* GRID — each card is totally independent */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
            margin-bottom: 2rem;
        }

        /* INDEPENDENT CARD: logo + select button only, no netflix box wrapping */
        .service-card {
            background: rgba(18, 22, 35, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1.8rem 1.2rem 1.5rem;
            transition: all 0.25s ease;
            border: 1px solid rgba(66, 85, 130, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 15px 30px -12px rgba(0, 0, 0, 0.4);
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: rgba(229, 9, 20, 0.6);
            background: rgba(22, 27, 45, 0.9);
            box-shadow: 0 25px 40px -15px rgba(0, 0, 0, 0.6);
        }

        /* logo wrapper — each card holds its own brand icon */
        .card-logo {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            min-height: 85px;
        }

        .card-logo img {
            max-width: 160px;
            max-height: 70px;
            object-fit: contain;
            filter: brightness(0) invert(1);
            transition: transform 0.2s;
        }

        /* specific logo adjustments for some brands */
        .card-logo .custom-logo-svg, 
        .card-logo .emoji-logo {
            font-size: 3rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .card-logo .text-logo {
            color: white;
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: 1px;
            background: linear-gradient(145deg, #fff, #cbd5e1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* SELECT BUTTON — each card has its own */
        .select-button {
            background: #0f111a;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 3rem;
            padding: 0.8rem 1.5rem;
            width: 100%;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: inherit;
            color: #f0f3fa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
            backdrop-filter: blur(4px);
        }

        .select-button:hover {
            background: #e50914;
            border-color: #e50914;
            color: white;
            transform: scale(1.01);
            box-shadow: 0 6px 14px rgba(229, 9, 20, 0.3);
        }

        .select-button:active {
            transform: scale(0.97);
        }

        /* toast-like dynamic status for each card (tiny popup feedback) */
        .card-feedback {
            margin-top: 0.9rem;
            font-size: 0.7rem;
            color: #9ca3af;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            width: 100%;
            transition: all 0.1s;
            pointer-events: none;
        }

        /* overall footer */
        .global-footer {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.7rem;
            color: #4b5563;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 1.8rem;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .services-grid {
                gap: 1rem;
                grid-template-columns: 1fr;
            }
            .service-card {
                padding: 1.4rem;
            }
            .card-logo img {
                max-height: 55px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1>⚡ ACCOUNT GENERATOR VAULT</h1>
        <p>Made by Love : Jovan Reguya</p>
    </div>

    <div class="services-grid" id="servicesGrid">
        <!-- 1. Netflix -->
        <div class="service-card" data-service="Netflix">
            <div class="card-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix">
            </div>
            <button class="select-button" onclick="window.location.href='netflix.html'">🎬 SELECT NETFLIX →</button>
        </div>

        <!-- 2. Steam -->
        <div class="service-card" data-service="Steam">
            <div class="card-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" alt="Steam" style="filter: brightness(0) invert(1); width: 50px;">
            </div>
            <button class="select-button" onclick="window.location.href='steam.html'">🎮 SELECT STEAM →</button>
        </div>

        <!-- 3. Crunchyroll -->
        <div class="service-card" data-service="Crunchyroll">
            <div class="card-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/f6/Crunchyroll_Logo.svg" alt="Crunchyroll" style="max-width: 130px;">
            </div>
              <button class="select-button" onclick="window.location.href='crunchyroll.html'">🍣 SELECT CRUNCHYROLL →</button>
        </div>

        <!-- 4. HBO Max -->
        <div class="service-card" data-service="HBO Max">
            <div class="card-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/17/HBO_Max_Logo.svg" alt="HBO Max" style="max-width: 115px;">
            </div>
            <button class="select-button" onclick="window.location.href='hbo.html'">⚡ SELECT HBO MAX →</button>
        </div>

        <!-- 5. Paramount+ -->
        <div class="service-card" data-service="Paramount+">
            <div class="card-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/9f/Paramount_Network.svg" alt="Paramount+" style="max-width: 120px;">
            </div>
            <button class="select-button" onclick="window.location.href='paramount.html'">🌠 SELECT PARAMOUNT+ →</button>
        </div>

        <!-- 6. Disney+ -->
        <div class="service-card" data-service="Disney+">
            <div class="card-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg" alt="Disney+" style="max-width: 110px;">
            </div>
            <button class="select-button" onclick="window.location.href='disney.html'">🌠 SELECT DISNEY+ →</button>
        </div>

        <!-- 7. CODM (Call of Duty Mobile) -->
        <div class="service-card" data-service="Call of Duty: Mobile">
            <div class="card-logo">
                <div class="emoji-logo" style="font-size: 3.2rem;">🔫🎯</div>
            </div>
            <button class="select-button" onclick="window.location.href='garena.html'">🌠 SELECT GARENA+ →</button>
        </div>

        <!-- 8. MLBB (Mobile Legends) -->
        <div class="service-card" data-service="Mobile Legends">
            <div class="card-logo">
                <div class="emoji-logo" style="font-size: 3.2rem;">🏆⚔️</div>
            </div>
            <button class="select-button" onclick="window.location.href='moonton.html'">🌠 SELECT MOONTON →</button>
        </div>

        <!-- 9. ExpressVPN -->
        <div class="service-card" data-service="ExpressVPN">
            <div class="card-logo">
                <div class="text-logo" style="font-size: 1.6rem; font-weight:800;">EXPRESSVPN</div>
            </div>
            <button class="select-button">🔒 SELECT EXPRESSVPN →</button>
            <div class="card-feedback">⚡ ready</div>
        </div>

        <!-- 10. Spotify -->
        <div class="service-card" data-service="Spotify">
            <div class="card-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" alt="Spotify" style="width: 55px;">
            </div>
            <button class="select-button">🎧 SELECT SPOTIFY →</button>
            <div class="card-feedback">⚡ ready</div>
        </div>

        <!-- 11. Xbox -->
        <div class="service-card" data-service="Xbox Game Pass">
            <div class="card-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Xbox_logo.svg" alt="Xbox" style="width: 55px; filter: brightness(0) invert(1);">
            </div>
            <button class="select-button" onclick="window.location.href='xbox.html'">🌠 SELECT XBOX →</button>
        </div>

        <!-- 12. PS4 (PlayStation) -->
        <div class="service-card" data-service="PlayStation Network">
            <div class="card-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/PlayStation_logo.svg" alt="PS4" style="width: 60px; filter: brightness(0) invert(1);">
            </div>
            <button class="select-button">🎮 SELECT PS4 →</button>
            <div class="card-feedback">⚡ ready</div>
        </div>

        <!-- 13. CapCut -->
        <div class="service-card" data-service="CapCut">
            <div class="card-logo">
                <div class="emoji-logo" style="font-size: 3rem;">✂️🎬</div>
            </div>
            <button class="select-button" onclick="window.location.href='capcut.html'">🌠 SELECT CAPCUT →</button>
        </div>
    </div>
    <div class="global-footer">
       
    </div>
</div>

<script>
    // ==============================================================
    // BRO, NO NETFLIX BOX WRAPPING. EACH CARD HAS ITS OWN LOGO & SELECT BUTTON
    // FIXED DARK THEME, ALL SERVICES: Netflix, Steam, Crunchyroll, HBO, Paramount+,
    // Disney+, CODM, MLBB, ExpressVPN, Spotify, Xbox, PS4, CapCut.
    // GENERATES RANDOM ACCOUNT CREDENTIALS + AUTO COPY TO CLIPBOARD
    // ==============================================================

    // utility random functions
    function randomString(len = 8) {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
        let out = '';
        for (let i = 0; i < len; i++) out += chars.charAt(Math.floor(Math.random() * chars.length));
        return out;
    }

    function randomDigits(len = 3) {
        return Math.floor(Math.random() * Math.pow(10, len)).toString().padStart(len, '0');
    }

    // credential generator per service (rich & realistic)
    function generateCredsForService(service) {
        const domains = ['@vault.gg', '@streamer.pro', '@blackcard.io', '@primehub.net', '@shadowcodes.com'];
        const domain = domains[Math.floor(Math.random() * domains.length)];
        
        switch (service) {
            case 'Netflix':
                return { email: `net_${randomString(6)}${domain}`, pwd: `Nf${randomString(10)}!${randomDigits(2)}`, extra: '4K UHD + 5 profiles' };
            case 'Steam':
                return { email: `steam_${randomString(7)}@steamguard.com`, pwd: `St${randomString(12)}@${randomDigits(3)}`, extra: 'Wallet: $87.50 · 44 games' };
            case 'Crunchyroll':
                return { email: `anime_${randomString(6)}${domain}`, pwd: `Cr${randomString(9)}#${randomDigits(2)}`, extra: 'Mega Fan · offline + simulcast' };
            case 'HBO Max':
                return { email: `hbomax_${randomString(7)}@maxorigin.com`, pwd: `HB${randomString(10)}!${randomDigits(2)}`, extra: 'Ultimate ad-free · 4K HDR' };
            case 'Paramount+':
                return { email: `para_${randomString(6)}${domain}`, pwd: `Para${randomString(9)}_${randomDigits(3)}`, extra: 'Essential + Showtime bundle' };
            case 'Disney+':
                return { email: `disney_${randomString(6)}@magickingdom.com`, pwd: `Dplus${randomString(9)}${randomDigits(2)}`, extra: 'Premium · IMAX Enhanced' };
            case 'Call of Duty: Mobile':
                return { email: `codm_${randomString(7)}@activision.com`, pwd: `CODM${randomString(8)}${randomDigits(3)}`, extra: 'Legendary rank + Mythic weapons' };
            case 'Mobile Legends':
                return { email: `mlbb_${randomString(6)}@moonton.com`, pwd: `MLBB${randomString(9)}!${randomDigits(2)}`, extra: 'Mythical Glory · 98 skins' };
            case 'ExpressVPN':
                return { email: `vpn_${randomString(8)}${domain}`, pwd: `VPN${randomString(12)}@${randomDigits(2)}`, extra: '1 year plan · unlimited bandwidth' };
            case 'Spotify':
                return { email: `spotify_${randomString(7)}@premiumify.com`, pwd: `Spot${randomString(10)}#${randomDigits(2)}`, extra: 'Family Premium · HiFi + offline' };
            case 'Xbox Game Pass':
                return { email: `xbox_${randomString(7)}@microsoft.com`, pwd: `Xbox${randomString(10)}!${randomDigits(3)}`, extra: 'Game Pass Ultimate · 24 months' };
            case 'PlayStation Network':
                return { email: `psn_${randomString(6)}@sony.com`, pwd: `PS${randomString(10)}_${randomDigits(4)}`, extra: 'PS Plus Premium + game catalog' };
            case 'CapCut':
                return { email: `capcut_${randomString(6)}@bytedance.com`, pwd: `Cap${randomString(10)}#${randomDigits(2)}`, extra: 'Pro · all assets unlocked · 4K export' };
            default:
                return { email: `user_${randomString(7)}${domain}`, pwd: `Pass${randomString(10)}!`, extra: 'premium access' };
        }
    }

    // display feedback inside specific card and show toast
    async function updateCardFeedback(cardElement, successMsg, isError = false) {
        const feedbackDiv = cardElement.querySelector('.card-feedback');
        if (feedbackDiv) {
            feedbackDiv.style.color = isError ? '#f87171' : '#a3e635';
            feedbackDiv.textContent = successMsg;
            setTimeout(() => {
                if (feedbackDiv) {
                    feedbackDiv.style.color = '#9ca3af';
                    feedbackDiv.textContent = '⚡ ready';
                }
            }, 2800);
        }
    }

    // copy to clipboard with full details
    async function copyToClipboard(service, email, password, extraInfo) {
        const credentialText = `🎬 SERVICE: ${service}\n📧 Email/Login: ${email}\n🔑 Password: ${password}\n✨ Extra: ${extraInfo}`;
        try {
            await navigator.clipboard.writeText(credentialText);
            return true;
        } catch (err) {
            console.warn("clipboard failed", err);
            alert("📋 Manual copy:\n" + credentialText);
            return false;
        }
    }

    // generate + copy + update specific card ui
    async function generateAndServe(cardElement, serviceName) {
        // disable button temporarily to avoid spam
        const btn = cardElement.querySelector('.select-button');
        const originalBtnText = btn.innerHTML;
        btn.innerHTML = '⏳ GENERATING ...';
        btn.disabled = true;
        
        try {
            // generate fresh account
            const creds = generateCredsForService(serviceName);
            // update feedback with generating visual
            const feedbackDiv = cardElement.querySelector('.card-feedback');
            if (feedbackDiv) feedbackDiv.textContent = `✨ ${serviceName} generated! copying...`;
            
            // copy to clipboard
            const copied = await copyToClipboard(serviceName, creds.email, creds.pwd, creds.extra);
            if (copied) {
                await updateCardFeedback(cardElement, `✅ ${serviceName} account copied! 📋`, false);
                // show small preview inside feedback (optional extra)
                const preview = `${creds.email} / ${creds.pwd}`;
                if (feedbackDiv) {
                    feedbackDiv.innerHTML = `✅ ${serviceName} · ${creds.email.substring(0, 18)}... copied`;
                    setTimeout(() => {
                        if (feedbackDiv && !feedbackDiv.innerHTML.includes('ready')) {
                            feedbackDiv.innerHTML = `⚡ ready · ${serviceName}`;
                            setTimeout(() => {
                                if (feedbackDiv) feedbackDiv.innerHTML = '⚡ ready';
                            }, 1800);
                        }
                    }, 2500);
                }
                // also show a browser notification? optional lightweight
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification(`🎉 ${serviceName}`, { body: `Account: ${creds.email}\nPassword copied to clipboard` });
                }
            } else {
                await updateCardFeedback(cardElement, `⚠️ copy manually (see alert)`, true);
            }
        } catch (err) {
            console.error(err);
            await updateCardFeedback(cardElement, `❌ generation error`, true);
        } finally {
            btn.innerHTML = originalBtnText;
            btn.disabled = false;
        }
    }

    // collect all cards and bind events
    const allCards = document.querySelectorAll('.service-card');
    allCards.forEach(card => {
        const serviceAttr = card.getAttribute('data-service');
        if (!serviceAttr) return;
        const selectBtn = card.querySelector('.select-button');
        if (selectBtn) {
            selectBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                await generateAndServe(card, serviceAttr);
            });
        }
        // optional: double-click on card? no needed only button, but respect design
        card.style.cursor = 'default';
    });

    // request notification permission on first click any button (graceful)
    let notificationAsked = false;
    document.querySelectorAll('.select-button').forEach(btn => {
        btn.addEventListener('click', () => {
            if (!notificationAsked && "Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
                notificationAsked = true;
            }
        });
    });

    // small additional fix: for images that might not load due to network, fallback emoji but it's fine
    // ensure that all logos are visible under dark theme
    const allImages = document.querySelectorAll('.card-logo img');
    allImages.forEach(img => {
        img.style.filter = 'brightness(0) invert(1)';
        img.style.opacity = '0.95';
    });
    // Manual exceptions for images that already have filter, avoid double invert on Steam etc (already invert)
    // but anyway it's consistent

    console.log("Dark theme grid | 13 independent cards | each has LOGO + SELECT button | Netflix, Steam, Crunchyroll, HBO, Paramount+, Disney+, CODM, MLBB, ExpressVPN, Spotify, Xbox, PS4, CapCut");
</script>
</body>
</html>
