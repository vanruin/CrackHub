<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Account Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1b2838 0%, #0d1b2a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #1a9fff 0%, #0d6efd 100%);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .logo svg {
            width: 70px;
            height: 70px;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
        }

        .logo-text {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #a0c4e8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin-top: 10px;
        }

        .main-box {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            transition: transform 0.3s;
        }

        .main-box:hover {
            transform: translateY(-5px);
        }

        .generate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1a9fff 0%, #0d6efd 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(26, 159, 255, 0.3);
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 159, 255, 0.4);
        }

        .generate-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 30px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a9fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #666;
            font-size: 14px;
        }

        .result-box {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            display: none;
            animation: slideUp 0.4s ease-out;
            border: 2px solid #28a745;
        }

        .result-box.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .success-icon {
            width: 60px;
            height: 60px;
            background: #28a745;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .success-icon svg {
            width: 35px;
            height: 35px;
            fill: white;
        }

        .success-header h3 {
            color: #28a745;
            font-size: 24px;
            margin-top: 10px;
        }

        .account-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #e0e0e0;
        }

        .field {
            margin-bottom: 15px;
        }

        .label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: block;
        }

        .value-container {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #dee2e6;
        }

        .value {
            flex: 1;
            font-family: monospace;
            font-size: 13px;
            color: #1a9fff;
            word-break: break-all;
            line-height: 1.5;
        }

        .copy-btn {
            background: #1a9fff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #0d6efd;
        }

        .copy-btn.copied {
            background: #28a745;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a9fff 0%, #0d6efd 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            margin-top: 10px;
            border: none;
            cursor: pointer;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 159, 255, 0.4);
        }

        .stats {
            margin-top: 20px;
            padding: 15px;
            background: #e7f3ff;
            border-radius: 10px;
            font-size: 12px;
            color: #004085;
            text-align: center;
        }

        .error-box {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        .error-box.show {
            display: block;
        }

        .error-message {
            color: #721c24;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="white">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
                </svg>
            </div>
            <div class="logo-text">STEAM</div>
            <div class="subtitle">Account Generator & Login Tool</div>
        </div>

        <div class="main-box">
            <button class="generate-btn" id="generateBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                </svg>
                Generate Steam Account
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div class="loading-text">Fetching Steam account...</div>
            </div>

            <div class="result-box" id="resultBox">
                <div class="success-header">
                    <div class="success-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                        </svg>
                    </div>
                    <h3>Account Generated!</h3>
                </div>

                <div class="account-section">
                    <div class="field">
                        <span class="label">📧 Email / Username</span>
                        <div class="value-container">
                            <div class="value" id="email">loading...</div>
                            <button class="copy-btn" data-field="email">Copy</button>
                        </div>
                    </div>

                    <div class="field">
                        <span class="label">🔑 Password</span>
                        <div class="value-container">
                            <div class="value" id="password">loading...</div>
                            <button class="copy-btn" data-field="password">Copy</button>
                        </div>
                    </div>
                </div>

                <a href="#" id="directLoginBtn" class="login-btn" target="_blank">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                        <path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.89-2-2-2zm0 16H5V5h14v14zM7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z"/>
                    </svg>
                    Open Steam Login
                </a>

                <div class="stats" id="stats">
                    <span id="statsText">Ready to generate</span>
                </div>
            </div>

            <div class="error-box" id="errorBox">
                <div class="error-message" id="errorMessage"></div>
            </div>
        </div>

        <div class="footer">
            🎮 Steam Account Generator | Secure & Fast
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const resultBox = document.getElementById('resultBox');
        const errorBox = document.getElementById('errorBox');
        const emailSpan = document.getElementById('email');
        const passwordSpan = document.getElementById('password');
        const directLoginBtn = document.getElementById('directLoginBtn');
        const statsText = document.getElementById('statsText');

        let currentAccount = null;

        generateBtn.addEventListener('click', async () => {
            generateBtn.disabled = true;
            loading.classList.add('show');
            resultBox.classList.remove('show');
            errorBox.classList.remove('show');
            
            try {
                const response = await fetch('/api/get-random-steam-account', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentAccount = data.data;
                    emailSpan.textContent = currentAccount.email;
                    passwordSpan.textContent = currentAccount.password;
                    
                    directLoginBtn.href = 'https://store.steampowered.com/login/';
                    
                    statsText.innerHTML = `✅ Account ready | ${data.accountsRemaining} accounts remaining`;
                    
                    resultBox.classList.add('show');
                    
                    document.querySelectorAll('.copy-btn').forEach(btn => {
                        btn.textContent = 'Copy';
                        btn.classList.remove('copied');
                    });
                } else {
                    throw new Error(data.error || 'Failed to generate Steam account');
                }
            } catch (err) {
                errorBox.classList.add('show');
                document.getElementById('errorMessage').innerHTML = `❌ ${err.message}<br><small>Please make sure steam.txt exists with email:pass format</small>`;
            } finally {
                generateBtn.disabled = false;
                loading.classList.remove('show');
            }
        });

        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const field = btn.getAttribute('data-field');
                let textToCopy = '';
                
                if (field === 'email') {
                    textToCopy = emailSpan.textContent;
                } else if (field === 'password') {
                    textToCopy = passwordSpan.textContent;
                }
                
                try {
                    await navigator.clipboard.writeText(textToCopy);
                    btn.textContent = 'Copied!';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = 'Copy';
                        btn.classList.remove('copied');
                    }, 2000);
                } catch (err) {
                    alert('Failed to copy');
                }
            });
        });
    </script>
</body>
</html>
